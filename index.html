<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b2a5c" />
    <meta
      name="description"
      content="Portal integrado de acesso aos sistemas de monitoria e gestão dos transportes da Área Metropolitana de Maputo."
    />

    <!-- Android / general -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="AMT" />

    <!-- iOS home-screen app metadata -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AMT" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Windows tiles -->
    <meta name="msapplication-TileColor" content="#0b2a5c" />
    <meta name="msapplication-TileImage" content="/icon-144.png" />

    <!--
      The manifest's `name`/`short_name` are just "AMT" and this page title
      is only "Sistemas de Monitoria e Gestão" (no repeated "AMT") on
      purpose: installed Chromium PWA windows compose their title bar as
      "<app name> — <page title>", so together they read as one clean
      "AMT — Sistemas de Monitoria e Gestão" instead of the app name
      appearing twice.
    -->
    <title>Sistemas de Monitoria e Gestão</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
